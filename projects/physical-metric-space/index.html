<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── OKLAB ─────────────────────────────────────────────────────────────────────
function oklabToLinear(L,a,b){
  const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_*l_*l_,m=m_*m_*m_,s=s_*s_*s_;
  return[4.0767416621*l-3.3077115913*m+0.2309699292*s,
    -1.2684380046*l+2.6097574011*m-0.3413193965*s,
    -0.0041960863*l-0.7034186147*m+1.7076147010*s];
}
const gammaEnc=c=>{c=Math.max(0,Math.min(1,c));return c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055};
function oklabToSRGB(L,a,b){return oklabToLinear(L,a,b).map(gammaEnc);}
// Keep lightness and hue exact: if a colour falls outside sRGB, shrink only its chroma until it fits
function oklabToSRGBMapped(L,a,b){
  const ok=k=>oklabToLinear(L,a*k,b*k).every(c=>c>=-1e-4&&c<=1+1e-4);
  if(ok(1)) return oklabToSRGB(L,a,b);
  let lo=0,hi=1;
  for(let i=0;i<14;i++){const mid=(lo+hi)/2;if(ok(mid))lo=mid;else hi=mid;}
  return oklabToSRGB(L,a*lo,b*lo);
}
// Position → colour. M (mass) sets lightness and is the vertical axis, so higher points are
// clearly brighter and lower ones darker; L and T set the hue plane (a, b).
function coordToColor(dL,dM,dT){
  const oL=Math.max(0.36,Math.min(0.9,0.64+dM*0.2)), oa=(dL/3)*0.22, ob=(dT/4)*0.24;
  const[r,g,b]=oklabToSRGBMapped(oL,oa,ob);
  const ri=Math.round(Math.max(0,Math.min(1,r))*255);
  const gi=Math.round(Math.max(0,Math.min(1,g))*255);
  const bi=Math.round(Math.max(0,Math.min(1,b))*255);
  return{hex:(ri<<16)|(gi<<8)|bi,r:ri,g:gi,b:bi,css:`rgb(${ri},${gi},${bi})`,oL,oa,ob};
}

// ── DOM ───────────────────────────────────────────────────────────────────────
const c3d=document.getElementById('c3d');
const clbl=document.getElementById('clbl');
const tip=document.getElementById('tip');
const panel=document.getElementById('panel');
const tab=document.getElementById('tab');
let W=window.innerWidth, H=window.innerHeight;

// ── Theme ─────────────────────────────────────────────────────────────────────
// Everything drawn on the canvases reads TH; the DOM chrome is themed in CSS via :root[data-theme]
const isLight=()=>document.documentElement.dataset.theme==='light';
const TH={};
function setTH(){
  const L=isLight();
  Object.assign(TH,L?{
    bg:0xe4e8f2, grid:0xc3cadb, halo:'rgba(248,250,255,.97)', pill:'rgba(255,255,255,.9)',
    uvPill:'rgba(255,255,255,.94)', ink:a=>`rgba(30,40,90,${a})`, shadow:'rgba(255,255,255,.98)'
  }:{
    bg:0x06061a, grid:0x0d0d22, halo:'rgba(4,4,20,.97)', pill:'rgba(4,4,20,.82)',
    uvPill:'rgba(8,10,34,.92)', ink:a=>`rgba(220,230,255,${a})`, shadow:'rgba(0,0,0,.98)'
  });

// ── Camera switching ──────────────────────────────────────────────────────────
function enterOrtho(){
  usingOrtho=true;
  // Size the frustum from INIT so it always opens showing the whole scene
  const h=ORTHO_H, asp=W/H;
  orthoCam.left=-h*asp; orthoCam.right=h*asp; orthoCam.top=h; orthoCam.bottom=-h;
  orthoCam.zoom=1; // reset any prior zoom
  // Copy current viewing direction from perspCam
  orthoCam.position.copy(perspCam.position);
  orthoCam.quaternion.copy(perspCam.quaternion);
  orthoCam.updateProjectionMatrix();
  // Hand controls to orthoCam — OrbitControls handles ortho dolly via camera.zoom
  controls.object=orthoCam;
  controls.minDistance=0; controls.maxDistance=Infinity; // not used for ortho, but safe
  activeCamera=orthoCam;
  controls.update();
}

function exitOrtho(newFov){
  // Reconstruct a perspective distance that matches the current ortho zoom level
  const h=ORTHO_H/orthoCam.zoom; // visible half-height at focus plane
  const d=h/Math.tan(THREE.MathUtils.degToRad(newFov/2));
  const dir=orthoCam.position.clone().sub(controls.target).normalize();
  perspCam.position.copy(controls.target).addScaledVector(dir,d);
  perspCam.quaternion.copy(orthoCam.quaternion);
  perspCam.fov=newFov;
  perspCam.updateProjectionMatrix();
  controls.object=perspCam;
  controls.minDistance=2; controls.maxDistance=60;
  activeCamera=perspCam;
  usingOrtho=false;
  controls.update();
}

function sliderToFOV(s){return 2+Math.pow(s/100,1.3)*88;}

}

// electric current, temperature, amount of substance and luminous intensity. Angle is a base

const AX=5.2;

function tubeAlong(dir,d,from,to,g,radius=0.030,steps=64,opacity=1){
  const len=to-from, ctr=(from+to)/2;
  const geo=new THREE.CylinderGeometry(radius,radius,len,8,steps);
  const pos=geo.attributes.position, n=pos.count, col=new Float32Array(n*3);
  for(let i=0;i<n;i++){const{r,g:gg,b}=dimColor(d,ctr+pos.getY(i));col[i*3]=r/255;col[i*3+1]=gg/255;col[i*3+2]=b/255;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:opacity<1,opacity}));
  const u=dir.clone().normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),u);
  mesh.position.copy(u.clone().multiplyScalar(ctr*dir.length()));
  mesh.scale.y=dir.length();
  g.add(mesh);
  [to,from].forEach(e=>{
    const{hex}=dimColor(d,e);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.35,10),new THREE.MeshPhongMaterial({color:hex,emissive:hex,emissiveIntensity:0.3,transparent:opacity<1,opacity}));
    cone.position.copy(dir.clone().multiplyScalar(e));
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),e>0?u:u.clone().negate());
    g.add(cone);
  });
}
function buildAxes(){

  axisGroup=new THREE.Group(); scene.add(axisGroup); AXIS_LABELS=[]; AXIS_TICKS=[];
  // An axis whose dimension the unit system removed stays, faded, and says which constant took it
  const add=(dir,d,ext,{sym=DIM_SYM[d],word=DIM_NAME[d],col=d,small=false}={})=>{
    const gone=SYS_ELIM[d], op=gone?0.22:1, L=dir.length();

    const tail=gone?` · ${CONSTS[gone].sym} = 1`:'';
    AXIS_LABELS.push({p:dir.clone().multiplyScalar(ext+0.5/L),t:`${sym} ${word}${tail} ${Math.abs(dir.y)>0.9?'↑':'→'}`,c:dimColor(col,2)});
    if(!small) AXIS_LABELS.push({p:dir.clone().multiplyScalar(-ext-0.5/L),t:`← −${sym}`,c:dimColor(col,-2)});
    if(gone) return;
    for(let n=-Math.floor(ext);n<=Math.floor(ext);n++){ if(!n) continue;
      const c=dimColor(col,n), p=dir.clone().multiplyScalar(n);
      const perp=Math.abs(dir.y)>0.9?new THREE.Vector3(0,0,0.1):new THREE.Vector3(0,0.1,0);

// A formula endpoint in the current system: the listed quantity's own exponents when there is one

const fsys=v=>{const p=ptSrc(...v);return p?ptv(p):sysVec(v);};
const fkey=v=>keyOf(...fsys(v));
const fShown=v=>{const x=fsys(v);return(VIEW.frac||!isFracV(x))&&(VIEW.xdims||!hasX(x));};
// Builds a gradient arrow from one exponent coordinate to another, oriented along +Y of its group.
// Caller adds the group to the scene (after applying any bundle offset).
function makeArrow(from,to,{SR,CR,opacity,emissive=0,cols=null}){
  const s=proj(from), e=proj(to);
  const dir=e.clone().sub(s), total=dir.length();
  // Half-steps (fractional exponents) are short, so shrink the end gaps and head to fit
  const MARGIN=Math.min(0.22,total*0.2), HEAD=Math.min(0.25,total*0.3);
  dir.normalize();
  const shaftLen=total-MARGIN*2-HEAD;
  if(shaftLen<=0.05) return null;
  const[sc,ec]=cols||[coordToColor(from[0],from[1],from[2]),coordToColor(to[0],to[1],to[2])];
  const shaftGeo=new THREE.CylinderGeometry(SR,SR,shaftLen,6,1);
  const pa=shaftGeo.attributes.position, cb=new Float32Array(pa.count*3);
  for(let j=0;j<pa.count;j++){
    const t=Math.max(0,Math.min(1,pa.getY(j)/shaftLen+0.5));
    cb[j*3]=(sc.r/255)*(1-t)+(ec.r/255)*t;
    cb[j*3+1]=(sc.g/255)*(1-t)+(ec.g/255)*t;
    cb[j*3+2]=(sc.b/255)*(1-t)+(ec.b/255)*t;
  }
  shaftGeo.setAttribute('color',new THREE.BufferAttribute(cb,3));
  const shaftMat=new THREE.MeshPhongMaterial({vertexColors:true,emissive:0xffffff,emissiveIntensity:emissive,transparent:true,opacity,depthWrite:false});
  const coneMat=new THREE.MeshPhongMaterial({color:ec.hex,emissive:ec.hex,emissiveIntensity:0.3+emissive,transparent:true,opacity,depthWrite:false,side:THREE.DoubleSide});
  const g=new THREE.Group();

  const cone=new THREE.Mesh(new THREE.ConeGeometry(CR,HEAD,8),coneMat); cone.position.y=shaftLen+HEAD/2; cone.renderOrder=2; g.add(cone);
  const pickLen=shaftLen+HEAD;
  const pm=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,pickLen,6),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  pm.position.y=pickLen/2; g.add(pm);
  g.position.copy(s.clone().addScaledVector(dir,MARGIN));
  const up=new THREE.Vector3(0,1,0);
  if(Math.abs(dir.dot(up))>0.9999){if(dir.y<0)g.rotation.z=Math.PI;}
  else g.quaternion.setFromUnitVectors(up,dir);

}
let showFormulas=false;
const formulaObjs=[], formulaPickMeshes=[];
function buildFormulas(){
  const FDEFS=FORMULA_DEFS.filter(d=>fShown(d.from)&&fShown(d.to));
  formulaObjs.forEach(fo=>{scene.remove(fo.g);fo.g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});});
  formulaObjs.length=0; formulaPickMeshes.length=0;
  const TAU=Math.PI*2;
  // Group by unordered endpoint pair — arrows between the same two points (in either direction) bundle together
  const segMap=new Map();
  FDEFS.forEach((def,idx)=>{
    const a=fkey(def.from), b=fkey(def.to);
    const k=a<b?`${a}|${b}`:`${b}|${a}`;
    if(!segMap.has(k)) segMap.set(k,[]);
    segMap.get(k).push(idx);
  });
  // Precompute a canonical perpendicular frame per segment so all arrows in a bundle share the same offset axes
  const segFrames=new Map();
  segMap.forEach((indices,k)=>{
    const d=FDEFS[indices[0]];
    const a=fkey(d.from), b=fkey(d.to);
    const cf=fsys(a<b?d.from:d.to), ct=fsys(a<b?d.to:d.from);
    const cd=proj(ct).sub(proj(cf)).normalize();
    const up=new THREE.Vector3(0,1,0);
    const q=new THREE.Quaternion();
    if(Math.abs(cd.dot(up))>0.9999){if(cd.y<0) q.set(0,0,1,0);}
    else q.setFromUnitVectors(up,cd);
    segFrames.set(k,{lx:new THREE.Vector3(1,0,0).applyQuaternion(q),lz:new THREE.Vector3(0,0,1).applyQuaternion(q)});
  });
  FDEFS.forEach((def,defIdx)=>{
    const a=fkey(def.from), b=fkey(def.to);
    const segKey=a<b?`${a}|${b}`:`${b}|${a}`;
    const bundle=segMap.get(segKey);
    const n=bundle.length, bi=bundle.indexOf(defIdx);
    const SR=n===1?0.025:Math.max(0.010,0.025-n*0.003);
    const CR=Math.max(0.035,0.065*(SR/0.025));
    const bundleR=n===1?0:0.04+n*0.02;
    const fc=v=>coordToColor(v[0],v[1],v[2]);
    const arrow=makeArrow(fsys(def.from),fsys(def.to),{SR,CR,opacity:0.72,cols:[fc(def.from),fc(def.to)]});
    if(!arrow) return;
    const{g,shaftMat,coneMat,pm,shaftLen,sc,ec}=arrow;
    if(n>1){
      const angle=bi*TAU/n;
      const{lx,lz}=segFrames.get(segKey);
      g.position.addScaledVector(lx,bundleR*Math.cos(angle));
      g.position.addScaledVector(lz,bundleR*Math.sin(angle));
    }
    scene.add(g);
    // World-space midpoint of shaft (including bundle offset) — used for label positioning
    const mid=new THREE.Vector3(0,shaftLen/2,0).applyQuaternion(g.quaternion).add(g.position);
    const midCol={r:Math.round((sc.r+ec.r)/2),g:Math.round((sc.g+ec.g)/2),b:Math.round((sc.b+ec.b)/2)};
    const fromKey=a, toKey=b;
    g.visible=showFormulas&&!overlayOn();
    const fo={g,def,mid,midCol,shaftMat,coneMat,fromKey,toKey};
    formulaObjs.push(fo);
    pm.userData={__fo:fo}; formulaPickMeshes.push(pm);
  });
}

// ── User Vectors ──────────────────────────────────────────────────────────────
// The user picks any two points A → B. The displacement Δ = B − A in exponent space is the
// dimension you must multiply A by to get B, so [B] = [A] · L^ΔL M^ΔM T^ΔT. We then look for
// named quantities with dimension Δ (multiply) or −Δ (divide) to phrase it as a physical equation.
// PT_BY_KEY (exponents in the current system → point) is rebuilt by placePoints
// The key only narrows the search; a hit must really sit at those exponents, so an arbitrary power
// like 0.499 doesn't snap Area's image (0.998) onto Length.
function ptAt(...v){
  v=vN(v); const p=PT_BY_KEY.get(keyOf(...v));
  return p&&!p.off&&ptv(p).every((x,i)=>Math.abs(x-v[i])<1e-6)?p:undefined;
}
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','/':'ᐟ','.':'·'};
const supStr=n=>String(n).split('').map(c=>SUP[c]).join('');
// Exponents as a product of base dimensions; in the FLT basis mass is rewritten as F·L⁻¹·T²
function dimStr(...v){
  v=vN(v); const parts=[];
  let terms=DIMS.map((d,i)=>[DIM_SYM[d],v[i]]);
  if(VIEW.basis==='F'){const m=v[1]; terms=[['F',m],['L',v[0]-m],['T',v[2]+2*m],...terms.slice(3)];}
  terms.forEach(([s,e])=>{const f=fracStr(e);if(f!=='0')parts.push(f==='1'?s:s+supStr(f));});
  return parts.join('·')||'1';
}
// SI form, whatever the current system and basis
const dimStrSI=v=>{const b=VIEW.basis;VIEW.basis='M';const t=dimStr(...v);VIEW.basis=b;return t;};
// Coordinates for display: L, M, T, A always, then any other exponent that is not zero
const coordStr=v=>{v=vN(v);return DIMS.map((d,i)=>i<4||v[i]?`${i<4?'':DIM_SYM[d]+' '}${fracStr(v[i])}`:null).filter(x=>x!==null).join(', ');};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=pt=>pt.entries[0];
function vectorEquations(a,b){
  const d=ptv(b).map((v,i)=>v-ptv(a)[i]);
  const[dL,dM,dT,dA]=d;
  const delta=dimStr(...d);
  const A=nm(a), B=nm(b);
  const named=[];   // [{eq, short}]
  const mul=ptAt(...d), div=ptAt(...d.map(v=>-v));
  if(mul) named.push({eq:`${B} = ${A} × ${nm(mul)}`,short:`× ${nm(mul)}`});
  if(div) named.push({eq:`${B} = ${A} ÷ ${nm(div)}`,short:`÷ ${nm(div)}`});
  // Prefer the factor with fewer negative exponents: "÷ Time" reads better than "× Frequency"
  const negs=p=>ptv(p).filter(e=>e<0).length;
  if(mul&&div&&negs(div)<negs(mul)) named.reverse();
  // No single named factor — try two named factors (P×Q or P÷Q)
  if(!named.length){
    const seen=new Set(), isZero=p=>ptv(p).every(x=>!x);
    for(const P of PTS){
      if(isZero(P)||P.off) continue;
      const Q=ptAt(...d.map((v,i)=>v-ptv(P)[i]));
      if(Q&&!isZero(Q)){const k=[P.key,Q.key].sort().join('|');
        if(!seen.has(k)){seen.add(k);named.push({eq:`${B} = ${A} × ${nm(P)} × ${nm(Q)}`,short:`× ${nm(P)} × ${nm(Q)}`});}}
      const R=ptAt(...d.map((v,i)=>ptv(P)[i]-v));
      if(R&&!isZero(R)&&R!==P) named.push({eq:`${B} = ${A} × ${nm(P)} ÷ ${nm(R)}`,short:`× ${nm(P)} ÷ ${nm(R)}`});
      if(named.length>=4) break;
    }
  }
  const generic=`[${B}] = [${A}] · ${delta}`;
  const known=[];
  FORMULA_DEFS.forEach(d=>{
    const f=fkey(d.from), t=fkey(d.to);
    if(f===a.key&&t===b.key) known.push(`${d.label}  (${d.desc})`);
    else if(f===b.key&&t===a.key) known.push(`${d.label}  (inverse: ${d.desc})`);
  });
  return{d,dL,dM,dT,dA,delta,named,generic,known,
    primary:named.length?named[0].eq:generic,
    short:named.length?named[0].short:`× ${delta}`};
}

// ── Calculus operators ────────────────────────────────────────────────────────
// A derivative d/dx divides by [x]; an integral ∫…dx multiplies by it. Either way it is the same

// arrows. Gradient, divergence and curl all share ∂/∂x's shift — they differ only in tensor rank,
// which L·M·T exponents can't see. Powers are different: √ and x² scale the vector about the origin
// (halving or doubling every exponent), so their arrows fan out radially instead of running parallel.
const OPERATORS=[
  {id:'ddt',   label:'d/dt',   shift:[0,0,-1], desc:'time derivative · rate of change',          eq:(a,b)=>`${b} = d(${a})/dt`},
  {id:'d2dt2', label:'d²/dt²', shift:[0,0,-2], desc:'second time derivative',                    eq:(a,b)=>`${b} = d²(${a})/dt²`},
  {id:'intdt', label:'∫dt',    shift:[0,0,1],  desc:'integral over time · accumulation',         eq:(a,b)=>`${b} = ∫ ${a} dt`},
  {id:'ddx',   label:'∂/∂x',   shift:[-1,0,0], desc:'space derivative · ∇, ∇·, ∇× share this shift', eq:(a,b)=>`${b} = ∂(${a})/∂x`},
  {id:'lap',   label:'∇²',     shift:[-2,0,0], desc:'Laplacian · second space derivative',       eq:(a,b)=>`${b} = ∇²(${a})`},
  {id:'intdx', label:'∫dx',    shift:[1,0,0],  desc:'line integral',                             eq:(a,b)=>`${b} = ∫ ${a} dx`},
  {id:'intdA', label:'∫dA',    shift:[2,0,0],  desc:'surface integral · flux',                   eq:(a,b)=>`${b} = ∫ ${a} dA`},
  {id:'intdV', label:'∫dV',    shift:[3,0,0],  desc:'volume integral',                           eq:(a,b)=>`${b} = ∫ ${a} dV`},
  {id:'ddth',  label:'∂/∂θ',   shift:[0,0,0,-1],desc:'angle derivative · per radian',           eq:(a,b)=>`${b} = ∂(${a})/∂θ`},
  {id:'intdth',label:'∫dθ',    shift:[0,0,0,1], desc:'integral over angle · e.g. ∫τ dθ = work',   eq:(a,b)=>`${b} = ∫ ${a} dθ`},
  {id:'intdO', label:'∫dΩ',    shift:[0,0,0,2], desc:'integral over solid angle · e.g. ∫L dΩ = irradiance', eq:(a,b)=>`${b} = ∫ ${a} dΩ`},
  {id:'sqrt',  label:'√',      scale:1/2,      desc:'square root · halves every exponent, toward the origin', eq:(a,b)=>`${b} = √(${a})`},
  {id:'sq',    label:'x²',     scale:2,        desc:'square · doubles every exponent, away from the origin', eq:(a,b)=>`${b} = (${a})²`},
  {id:'pow',   label:'xⁿ',     scale:2/3,      desc:'power · multiplies every exponent by n', eq:(a,b)=>`${b} = (${a})${supStr(fracStr(POW_OP.scale))}`},

const POW_OP=OPERATORS.find(o=>o.id==='pow');
// Parses "2/3", "-5/3", "1.5" → number; null when unusable
function parseExp(str){
  const m=String(str).trim().match(/^(-?\d+(?:\.\d+)?)(?:\s*\/\s*(\d+(?:\.\d+)?))?$/);
  if(!m) return null;
  const v=m[2]?parseFloat(m[1])/parseFloat(m[2]):parseFloat(m[1]);
  return Number.isFinite(v)&&Math.abs(v)<=6?v:null;

// Where op sends point p (or, with inv, where p came from)
// The shift is projected into the current unit system (with c = ħ = 1, d/dt is × energy)
const opApply=(op,p,inv=false)=>op.scale!==undefined
  ?ptv(p).map(v=>inv?v/op.scale:v*op.scale)

const opObjs=[], opPickMeshes=[];
let activeOp=null, hoveredOp=null;

const opBtns=[];
// Longest run P → op(P) → op(op(P)) … where every step lands on a named quantity
function opChain(op){
  let best=[];
  PTS.forEach(p=>{
    if(p.off||!p.lead) return;
    if(keyOf(...opApply(op,p))===p.key) return;           // the origin is fixed under scaling
    if(op.scale!==0&&ptAt(...opApply(op,p,true))) return; // only start chains at their first link
    const chain=[p];
    for(let q=ptAt(...opApply(op,p));q&&!chain.includes(q);q=ptAt(...opApply(op,q))) chain.push(q);
    if(chain.length>best.length) best=chain;

// ── Power laws ────────────────────────────────────────────────────────────────
// A power law multiplies powers of quantities: E(k) = C·ε²ᐟ³·k⁻⁵ᐟ³. Each factor Xᵖ adds p times X's
// vector, so the law is a path from the origin that steps along each factor's ray in turn. The
// steps can wander through fractional points even when the law lands on a whole-number one.
const POWER_LAWS=[
  {id:'kolmogorov-spectrum', label:'E(k) = C·ε²ᐟ³·k⁻⁵ᐟ³', desc:'Kolmogorov turbulence spectrum', lands:'Energy Spectrum E(k)', terms:[['ε',[2,0,-3],2/3],['k',[-1,0,0],-5/3]]},
  {id:'kolmogorov-length', label:'η = (ν³/ε)¹ᐟ⁴',       desc:'Kolmogorov length scale',        terms:[['ν',[2,0,-1],3/4],['ε',[2,0,-3],-1/4]]},
  {id:'kolmogorov-time', label:'τη = (ν/ε)¹ᐟ²',       desc:'Kolmogorov time scale',          terms:[['ν',[2,0,-1],1/2],['ε',[2,0,-3],-1/2]]},
  {id:'pendulum', label:'ω = √(g/L)·rad',      desc:'pendulum angular frequency',     lands:'Angular Frequency ω', terms:[['g',[1,0,-2],1/2],['L',[1,0,0],-1/2],['rad',[0,0,0,1],1]]},
  {id:'string-wave', label:'v = √(T/μ)',          desc:'wave speed on a string',         terms:[['T',[1,1,-2],1/2],['μ',[-1,1,0],-1/2]]},
  {id:'escape-velocity', label:'v = √(2GM/r)',        desc:'escape velocity',                terms:[['GM',[3,0,-2],1/2],['r',[1,0,0],-1/2]]},
  {id:'kepler-third', label:'T = 2π√(a³/GM)',      desc:"Kepler's third law",             terms:[['a',[1,0,0],3/2],['GM',[3,0,-2],-1/2]]},
  {id:'diffusion-length', label:'ℓ = √(D·t)',          desc:'diffusion length',               terms:[['D',[2,0,-1],1/2],['t',[0,0,1],1/2]]},
];
const termStr=([sym,,p])=>p===1?sym:sym+supStr(fracStr(p));
function setLaw(law){
  clearOpArrows();
  activeLaw=law; activeOp=null; lawLanding=null;
  syncOverlayUI();
  if(!law) return;
  let pos=vN([]), sofar='';
  const end=law.terms.reduce((acc,[,d,p])=>acc.map((v,i)=>v+p*vN(d)[i]),vN([]));
  const landing=ptAt(...sysVec(end));
  // Name the result after the quantity the law is about, not whichever member is listed first
  const landName=landing&&(landing.entries.includes(law.lands)?law.lands:nm(landing));
  if(landing) lawLanding={pt:landing,name:landName};
  law.terms.forEach((term,i)=>{
    const[sym,d,p]=term, next=pos.map((v,j)=>v+p*vN(d)[j]);
    const step=termStr(term); sofar=sofar?`${sofar}·${step}`:step;
    const last=i===law.terms.length-1;
    const arrow=makeArrow(pos,next,{SR:0.034,CR:0.085,opacity:0.95,emissive:0.2});
    if(arrow){
      scene.add(arrow.g);
      const o={...arrow,from:ptAt(...sysVec(pos))||null,to:last?landing:null,law,baseOp:0.95,eq:law.label};
      o.tipHtml=tipHead(law.label)+tipSub(esc(law.desc))+
        `<div style="font-size:9px;color:#ccd">step ${i+1}: × ${esc(step)} — adds ${esc(fracStr(p))} × [${esc(sym)}] = ${esc(dimStr(...sysVec(vN(d).map(v=>v*p))))}</div>`+
        `<div style="font-size:9px;color:#99a;margin-top:2px">now at ${esc(dimStr(...sysVec(next)))}${last&&landing?` = ${esc(landName)}`:''}</div>`+tipFoot;
      arrow.pm.userData={__op:o}; opPickMeshes.push(arrow.pm); opObjs.push(o);
    }
    if(!last){
      // Ghost marker for the intermediate product, which usually has no name of its own
      const col=coordToColor(...next);
      const ghost=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),new THREE.MeshBasicMaterial({color:col.hex,wireframe:true,transparent:true,opacity:0.8}));
      ghost.position.copy(proj(next)); scene.add(ghost);

    }

  });
  const path=['1',...law.terms.map((t,i)=>law.terms.slice(0,i+1).map(termStr).join('·'))].join(' → ');
  opHint.innerHTML=`<span class="oph">${esc(law.label)}</span> · ${esc(law.desc)}<br>`+
    `<span style="color:#99a">path: ${esc(path)} = ${esc(dimStr(...sysVec(end)))}${landing?` (${esc(landName)})`:''}</span>`+
    `<div class="opc" data-copy="${esc(law.label)}" title="Click to copy">${esc(law.label)}</div>`;
  opHint.style.display='block';
}

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

// but raise its OKLab lightness to at least 0.78 so labels of dark (low-mass) points stay readable.
const LIFT_CACHE=new Map();
function liftRGB(r,g,b){
  const k=((r<<16)|(g<<8)|b)*2+(isLight()?1:0); if(LIFT_CACHE.has(k)) return LIFT_CACHE.get(k);

  const R=lin(r),G=lin(g),B=lin(b);

  const q=Math.cbrt(0.0883024619*R+0.2817188376*G+0.6299787005*B);

  const A=1.9779984951*l-2.4285922050*m+0.4505937099*q;

  const tgt=isLight()?(L>0.42?0.42:null):(L<0.78?0.78:null);

}

    :E.length>1?'<div style="color:#7e7e8e;font-size:8.5px;margin-bottom:3px">one kind · all commensurable</div>':'';
  const body=g.length>1
    ?g.map(p=>`<div style="color:${ink(dimColor('A',p.A).css)};font-size:8.5px;margin-top:3px">${esc(dimStr(...ptv(p)))}${VIEW.vis.A?'':' (angle hidden)'}</div>`+p.kinds.map(k=>`• ${k.map(esc).join(' = ')}`).join('<br>')).join('')

let downAt=null;
c3d.addEventListener('pointerdown',e=>{if(e.isPrimary)downAt={x:e.clientX,y:e.clientY};});
c3d.addEventListener('pointerup',e=>{
  if(!e.isPrimary||!downAt) return;
  const moved=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y); downAt=null;
  if(moved>6) return;
  const{pt,fo,uv,op,cm}=hitAt(e.clientX,e.clientY);
  if(drawMode){
    if(!pt){drawStart=null;updateDrawUI();return;}
    if(!drawStart||drawStart===pt){drawStart=drawStart===pt?null:pt;}
    else{addUserVector(drawStart,pt);drawStart=null;}
    updateDrawUI(); pick(e,true);
    return;
  }
  if(uv){showCard(uv);copyText(uv.eq.primary);}
  else if(op) copyText(op.eq);
  else if(cm){copyText(cm.name);tutEmit('point');tutEmit('bead');}
  else if(fo){copyText(fo.def.label);tutEmit('formula');}
  else if(pt){copyText(grpEntries(pt).join(', '));tutEmit('point');}
});

function sysOfK(k,basis){return SYSTEMS.find(s=>(s.basis||'M')===basis&&s.k.length===k.length&&s.k.every(id=>k.includes(id)));}
function updateSysUI(){
  if(!sysUI.pre) return;
  sysUI.pre.forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW.sys));
  sysUI.k.forEach(b=>b.classList.toggle('on',VIEW.k.includes(b.dataset.v)));

  sysUI.note.textContent=(sys?sys.note:`Custom: ${VIEW.k.map(id=>CONSTS[id].sym).join(', ')} set to 1.`)+(removed?` (${removed})`:'')+
    ' Kinds stay separate: points that meet share a sphere, with one bead per kind.';
}
// Points slide from where they were to where the new system puts them
let sysTween=null;
function setSystem(id,k,basis){
  const before=new Map(PTS.map(pt=>[pt,pt.pos.clone()]));
  VIEW.k=CONST_ORDER.filter(c=>k.includes(c)); VIEW.basis=basis||'M';
  const pre=sysOfK(VIEW.k,VIEW.basis); VIEW.sys=id||(pre?pre.id:'custom');
  // Gaussian electromagnetism lives on half-integer points
  if(VIEW.k.includes('eps0')&&!VIEW.frac){VIEW.frac=true;toast('Fractional exponents shown');}
  applyView();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  PTS.forEach(pt=>{pt.pos1=pt.pos.clone(); pt.pos0=before.get(pt)||pt.pos1.clone();});
  const hid=[...formulaObjs,...userVecs,...opObjs].map(o=>[o.g,o.g.visible]);
  hid.forEach(([g])=>g.visible=false);
  if(stalkGroup) stalkGroup.visible=false;
  PTS.forEach(pt=>{if(pt.holder)pt.holder.visible=false; pt.vis.visible=!pt.off&&metricsVis!=='hidden'; pt.projLine.visible=false;});
  sysTween={t0:performance.now(),dur:900,hid};
  stepSysTween(sysTween.t0);
}
function stepSysTween(now){
  const tw=sysTween, u=Math.min(1,(now-tw.t0)/tw.dur), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  PTS.forEach(pt=>{
    pt.pos.lerpVectors(pt.pos0,pt.pos1,e);
    [pt.vis,pt.rim,pt.glow,pt.ring,pt.pick].forEach(o=>o.position.copy(pt.pos));
    if(pt.holder) pt.holder.position.copy(pt.pos);
  });
  if(u<1) return;
  sysTween=null;
  PTS.forEach(pt=>{pt.pos.copy(pt.pos1);});
  tw.hid.forEach(([g,v])=>g.visible=v);
  applyMetricsVis();
}

const KIND_COL={operator:'#7ee',quantity:'#8fb',formula:'#fc8',operation:'#f9c',control:'#9bf',tutorial:'#ff9',term:'#c9f'};
const norm=t=>String(t).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
function scoreEntry(en,q,qn){
  let best=0;
  // Symbols are case-sensitive: "F" is force, "f" is frequency
  for(const s of en.sym){ if(s===q) best=Math.max(best,100); else if(norm(s)===qn) best=Math.max(best,70); }
  const t=norm(en.title);
  if(t===qn) best=Math.max(best,95);
  else if(t.startsWith(qn)) best=Math.max(best,85);
  else if(new RegExp('\\b'+qn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t)) best=Math.max(best,75);
  else if(qn.length>1&&t.includes(qn)) best=Math.max(best,60);
  for(const k of en.keys){ const kn=norm(k); if(!kn) continue;
    if(kn===qn) best=Math.max(best,65); else if(qn.length>1&&kn.includes(qn)) best=Math.max(best,45); }
  if(norm(en.sub).includes(qn)&&qn.length>1) best=Math.max(best,30);
  return best;
}
function hl(text,qn){
  const t=String(text), i=qn.length>0?norm(t).indexOf(qn):-1;
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+qn.length))+'</mark>'+esc(t.slice(i+qn.length));
}
const sq=document.getElementById('sq'), sres=document.getElementById('sres'), sqx=document.getElementById('sqx');
let sHits=[], sAct=0;
function runSearch(){
  const q=sq.value.trim(), qn=norm(q);
  sqx.style.display=q?'block':'none';
  if(!q){sres.style.display='none';sHits=[];return;}
  sHits=SEARCH_INDEX.map(en=>({en,sc:scoreEntry(en,q,qn)})).filter(h=>h.sc>0)
    .sort((a,b)=>b.sc-a.sc||a.en.title.length-b.en.title.length).slice(0,14);
  sAct=0;
  sres.innerHTML=sHits.length?sHits.map((h,i)=>{
    const en=h.en,col=KIND_COL[en.kind]||'#aab', symHit=en.sym.find(s=>s===q||norm(s)===qn);
    return `<div class="sr${i===sAct?' act':''}" data-i="${i}" role="option"><span class="srk" style="color:${ink(col)}">${en.kind}</span>`+
      `<div><div class="srt">${hl(en.title,qn)}${symHit?` <span style="color:${ink(col)}">(${esc(symHit)})</span>`:''}</div><div class="srs">${qn.length>1?hl(en.sub,qn):esc(en.sub)}</div></div></div>`;
  }).join(''):`<div class="snone">No matches for “${esc(q)}”</div>`;
  sres.style.display='block';
}
function pickHit(i){
  const h=sHits[i]; if(!h) return;
  sres.style.display='none'; sq.blur(); h.en.go(); tutEmit('search');
}
function markAct(){sres.querySelectorAll('.sr').forEach((el,i)=>el.classList.toggle('act',i===sAct));
  const a=sres.querySelector('.sr.act'); if(a) a.scrollIntoView({block:'nearest'});}
sq.addEventListener('input',runSearch);
sq.addEventListener('focus',()=>{if(sq.value.trim())runSearch();});
sq.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){sAct=Math.min(sHits.length-1,sAct+1);markAct();e.preventDefault();}
  else if(e.key==='ArrowUp'){sAct=Math.max(0,sAct-1);markAct();e.preventDefault();}
  else if(e.key==='Enter'){pickHit(sAct);e.preventDefault();}
  else if(e.key==='Escape'){sq.value='';runSearch();sq.blur();}
  e.stopPropagation();
});
sres.addEventListener('pointerdown',e=>e.preventDefault()); // keep focus so the click lands
sres.addEventListener('click',e=>{const r=e.target.closest('.sr');if(r)pickHit(+r.dataset.i);});
sqx.addEventListener('click',()=>{sq.value='';runSearch();hideCard();sq.focus();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#search'))sres.style.display='none';});

// Glossary html already contains trusted markup; only expand [[links]] there.
const glossHTML=t=>String(t).replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(_,k,txt)=>`<span class="term" data-t="${k}" tabindex="0" role="button">${txt}</span>`);

// Manipulatives inside tooltips
const MANIP={
  exp(el){
    el.insertAdjacentHTML('beforeend',`<div class="mout"></div><div class="prow"><span class="pl">n</span><input type="range" min="-3" max="3" value="2" aria-label="Exponent"><span class="pv"></span></div>`);
    const out=el.querySelector('.mout'), r=el.querySelector('input'), pv=el.querySelector('.pv');
    const words={'-3':'per cubic metre','-2':'per square metre','-1':'per metre','0':'a pure number','1':'a length','2':'an area','3':'a volume'};
    const shape=n=>n===0?'<circle cx="40" cy="30" r="4" fill="#9bf"/>':n===1?`<line x1="10" y1="40" x2="70" y2="40" stroke="${LC}" stroke-width="3"/>`:
      n===2?`<rect x="20" y="10" width="40" height="40" fill="${LC}" opacity=".55" stroke="${LC}"/>`:
      `<path d="M15 22 L45 22 L45 52 L15 52Z" fill="${LC}" opacity=".55" stroke="${LC}"/><path d="M15 22 L30 10 L60 10 L45 22Z M45 22 L60 10 L60 40 L45 52Z" fill="${LC}" opacity=".35" stroke="${LC}"/>`;
    const draw=()=>{const n=+r.value; pv.textContent=n;
      out.innerHTML=`<svg viewBox="0 0 230 60" width="230" height="60">${n<0?`<text x="0" y="36" fill="#aab" font-size="16">1 /</text><g transform="translate(30,0)">${shape(-n)}</g>`:shape(n)}<text x="${n<0?118:96}" y="26" fill="${LC}" font-size="14" font-weight="bold">L${n===1?'':supStr(n)}</text><text x="${n<0?118:96}" y="44" fill="#aab" font-size="9">${words[n]}</text></svg>`;};
    r.addEventListener('input',draw); draw();
  },
  mult(el){
    el.insertAdjacentHTML('beforeend',`<div class="mout"></div><div class="prow"><span class="pl">a</span><input type="range" min="-2" max="3" value="2" aria-label="First exponent"><span class="pv"></span></div><div class="prow"><span class="pl">b</span><input type="range" min="-2" max="3" value="1" aria-label="Second exponent"><span class="pv"></span></div>`);
    const out=el.querySelector('.mout'), [ra,rb]=el.querySelectorAll('input'), [pa,pb]=el.querySelectorAll('.pv');
    const blocks=(n,c,x0)=>[...Array(Math.abs(n))].map((_,i)=>`<rect x="${x0+i*13}" y="34" width="11" height="11" rx="2" fill="${n<0?'none':c}" stroke="${c}" stroke-dasharray="${n<0?'2 2':''}"/>`).join('');
    const draw=()=>{const a=+ra.value,b=+rb.value,s=a+b; pa.textContent=a; pb.textContent=b;
      const L=n=>n===1?'L':'L'+supStr(n);
      out.innerHTML=`<svg viewBox="0 0 220 50" width="220" height="50"><text x="0" y="20" font-size="14" font-weight="bold"><tspan fill="#9bf">${L(a)}</tspan><tspan fill="#aab"> × </tspan><tspan fill="#fc8">${L(b)}</tspan><tspan fill="#aab"> = </tspan><tspan fill="${LC}">${L(s)}</tspan></text>${blocks(a,'#9bf',0)}${blocks(b,'#fc8',Math.abs(a)*13+6)}<text x="${(Math.abs(a)+Math.abs(b))*13+12}" y="44" fill="${LC}" font-size="10">→ ${a}+${b<0?'('+b+')':b} = ${s}</text></svg>`;};
    ra.addEventListener('input',draw); rb.addEventListener('input',draw); draw();
  },
};

// Nested tooltip stack
const ttStack=[];
function closeTT(from=0){while(ttStack.length>from){const t=ttStack.pop();t.el.remove();if(t.src)t.src.classList.remove('open');}}
function openTT(key,anchor,src){
  const g=GLOSS[key]; if(!g) return;
  const parent=src&&src.closest('.tt'), lv=parent?+parent.dataset.lv+1:0;
  if(ttStack[lv]&&ttStack[lv].key===key&&ttStack[lv].src===src){closeTT(lv);return;}
  closeTT(lv);
  const el=document.createElement('div'); el.className='tt'; el.dataset.lv=lv; el.setAttribute('role','tooltip');
  const depth=['overview','detail','basics','basics'][Math.min(lv,3)];
  el.innerHTML=`<div class="tth"><span>${esc(g.t)}</span><span class="ttd">${depth}</span></div>${g.v||''}<div class="ttb">${glossHTML(g.h)}</div>`;
  if(g.m) MANIP[g.m](el);
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2+lv*10),vw-w-8);
  let y=r.bottom+6; if(y+h>vh-8) y=Math.max(8,r.top-h-6);
  // A nested card goes below (or above) its whole parent card so the parent stays readable
  // Terms in the tutorial card open below (or above) the whole card, never over its buttons
  const box=parent||(src&&src.closest('#coach'));
  if(box){const pr=box.getBoundingClientRect();
    if(pr.bottom+6+h<=vh-8) y=pr.bottom+6; else if(pr.top-h-6>=8) y=pr.top-h-6;}
  el.style.left=x+'px'; el.style.top=y+'px';
  if(src) src.classList.add('open');
  ttStack[lv]={el,key,src};
}
let ttHoverTimer=0;
document.addEventListener('click',e=>{
  const t=e.target.closest('.term');
  if(t){openTT(t.dataset.t,t,t);e.preventDefault();e.stopPropagation();return;}
});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.term');
  if(t&&(e.key==='Enter'||e.key===' ')){openTT(t.dataset.t,t,t);e.preventDefault();e.stopPropagation();}
},true);
if(matchMedia('(hover:hover)').matches){
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest('.term');
    clearTimeout(ttHoverTimer);
    if(t&&!t.classList.contains('open')) ttHoverTimer=setTimeout(()=>{if(!t.classList.contains('open'))openTT(t.dataset.t,t,t);},180);
  });
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.tt,.term,#search'))closeTT(0);});

// Persistence (best effort — the page works without storage)
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;}},

// ── Theme switching (device setting by default; the button saves an override) ─
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.dataset.theme=t; setTH(); LIFT_CACHE.clear();
  scene.background.setHex(TH.bg); buildAxes();
  PTS.forEach(pt=>{if(pt.glow){pt.glow.material.blending=isLight()?THREE.NormalBlending:THREE.AdditiveBlending;pt.glow.material.needsUpdate=true;}});
  themeBtn.querySelector('.knob').innerHTML=ICON(isLight()?'sun':'moon');
  themeBtn.setAttribute('aria-checked',String(!isLight()));
  themeBtn.title=isLight()?'Dark mode: off':'Dark mode: on';
}
themeBtn.addEventListener('click',()=>{const t=isLight()?'dark':'light';try{localStorage.setItem('theme',t);}catch{}applyTheme(t);});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{
  let saved=null;try{saved=localStorage.getItem('theme');}catch{}
  if(saved!=='light'&&saved!=='dark') applyTheme(e.matches?'light':'dark');});
// Follow a switch made in another tab, or on the page this is embedded in (same origin)
addEventListener('storage',e=>{if(e.key==='theme'&&(e.newValue==='light'||e.newValue==='dark'))applyTheme(e.newValue);});

// ── Share links ───────────────────────────────────────────────────────────────
// The whole view fits in the URL fragment (#v=1&cam=…&vec=…), so a link reopens exactly what you
// saw, on any static host, with nothing stored on a server. The format is a public contract
// (documented in the README); to keep old links working for good:
//  · keys are never renamed, removed or given a new meaning; new settings get new keys;
//  · a missing key means the frozen SHARE_V1 default below, never the app's current default;
//  · quantities are named by their exponents (L,M,T,A), which are physics and never change,
//    not by list position or display name; operators and laws by their fixed ids;
//  · anything unknown or out of range is skipped, so a link from a newer version still opens;
//  · a retired setting is mapped to its nearest replacement: the oblique angle axis is gone, so
//    mode=oblique (also the v1 default) opens as stalks, and lam is accepted and ignored.
const REPO_URL='https://github.com/Dentarthurdent42/physical-metric-space';
const SHARE_VERSION=1;
const SHARE_V1={cam:[9,6,11],tgt:[0,0,0],fov:50,zoom:1,dims:'LMTA',mode:'oblique',lam:1,slice:1,frac:false,
  spheres:'full',labels:'full',lsize:9.5,lfont:'courier',lfx:'halo',formulas:false,rot:false,n:2/3,
  sys:'si',k:[],xd:false};   // sys, k and xd came after v1 shipped; missing means SI, as v1 links were
const numStr=v=>String(+(+v).toFixed(3));
const numParse=s=>{const m=/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/.exec(String(s).trim());
  if(!m)return null;const v=m[2]?+m[1]/+m[2]:+m[1];return Number.isFinite(v)?v:null;};

const vecParse=(s,n)=>{const a=String(s).split(',').map(numParse);return a.length===n&&a.every(v=>v!==null)?a:null;};
// A point by its SI exponents, written with exact fractions: L,M,T,A first (1,0,-2,0 or
// -1/2,1/2,-1,0), then I,Θ,N,J only when one of them is not zero (0,0,1,0,1 is charge).
// A Gaussian c-shift is not written: the SI vector names the quantity in every system.
const ptStr=p=>{const v=p.s.map(fracStr); let n=ND; while(n>4&&v[n-1]==='0') n--; return v.slice(0,n).join(',');};
let shareLegacyGauss=false;
const ptParse=s=>{const a=String(s).split(',').map(numParse);
  if(!(a.length>=3&&a.length<=ND&&a.every(v=>v!==null))) return null;
  const p=SRC_BY_KEY.get(keyOf(...a)); if(p) return p;
  // Before unit systems, electromagnetic points were listed in Gaussian form by L,M,T,A only
  const g=a.length<=4&&LEGACY_GAUSS.get(keyOf(...a)); if(g){shareLegacyGauss=true; return g;}
  return null;};
const MODES=['oblique','stalk','slice'], MODE_NOW={oblique:'stalk',stalk:'stalk',slice:'slice'}, VISV=['full','low','hidden'], LFX=['none','shadow','halo','outline','pill','glow'];

function shareState(){
  const st={v:SHARE_VERSION};
  const cam=activeCamera.position, tgt=controls.target;
  st.cam=vecStr(cam.toArray()); st.tgt=vecStr(tgt.toArray());
  if(usingOrtho){st.proj='ortho'; st.zoom=numStr(orthoCam.zoom);} else st.fov=numStr(perspCam.fov);
  const dims=DIMS.filter(d=>VIEW.vis[d]).join('');
  st.dims=dims;   // always explicit: the app's default (SI) differs from the frozen v1 default (LMTA)
  if(dims==='LMTA') st.mode=VIEW.mode;   // always explicit: the v1 default (oblique) no longer exists
  if(VIEW.slice!==SHARE_V1.slice) st.slice=VIEW.slice;
  if(!!VIEW.frac!==SHARE_V1.frac) st.frac=VIEW.frac?1:0;
  if(VIEW.sys!==SHARE_V1.sys) st.sys=VIEW.sys;
  if(VIEW.sys==='custom') st.k=VIEW.k.join(',')||'none';
  if(VIEW.xdims!==SHARE_V1.xd) st.xd=VIEW.xdims?1:0;
  if(metricsVis!==SHARE_V1.spheres) st.spheres=metricsVis;
  if(labelsVis!==SHARE_V1.labels) st.labels=labelsVis;
  if(lblSize!==SHARE_V1.lsize) st.lsize=numStr(lblSize);
  const font=LBL_FONTS.find(f=>f[2]===lblFont); if(font&&font[0]!==SHARE_V1.lfont) st.lfont=font[0];
  if(lblEffect!==SHARE_V1.lfx) st.lfx=lblEffect;
  if(showFormulas!==SHARE_V1.formulas) st.formulas=showFormulas?1:0;
  if(autoRotOn!==SHARE_V1.rot) st.rot=autoRotOn?1:0;
  if(activeOp){st.op=activeOp.id; if(activeOp===POW_OP) st.n=fracStr(POW_OP.scale);}
  else if(activeLaw) st.law=activeLaw.id;
  if(userVecs.length) st.vec=userVecs.map(u=>`${ptStr(u.from)}~${ptStr(u.to)}`).join(';');
  if(focusPt&&vcard.style.display==='block'&&!selectedUV) st.focus=ptStr(focusPt);
  // Only characters that need no escaping in a fragment: letters, digits , ; ~ / . -
  return Object.entries(st).map(([k,v])=>`${k}=${v}`).join('&');
}
function shareURL(){return location.href.replace(/#.*$/,'')+'#'+shareState();}

// Applies a fragment; returns how many entries could not be used (so the viewer can be told)
function applyShare(hash){
  const q=new Map();
  hash.replace(/^#/,'').split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0){
    try{q.set(decodeURIComponent(kv.slice(0,i)),decodeURIComponent(kv.slice(i+1)));}catch{}}});
  if(!q.has('v')&&!q.has('cam')) return null;          // not a share link (e.g. some other #anchor)
  const ver=parseInt(q.get('v')||'1',10)||1;
  let skipped=0;
  const get=(k,parse,ok=()=>true)=>{if(!q.has(k))return SHARE_V1[k];const v=parse(q.get(k));
    if(v===null||v===undefined||!ok(v)){skipped++;return SHARE_V1[k];}return v;};
  const bool=s=>s==='1'?true:s==='0'?false:null;
  const oneOf=list=>s=>list.includes(s)?s:null;
  // Dimensions first: they decide where every point sits
  const dims=get('dims',s=>/^[LMTA]{1,4}$/.test(s)?s:null);
  VIEW.vis=Object.fromEntries(DIMS.map(d=>[d,dims.includes(d)]));
  VIEW.mode=MODE_NOW[get('mode',oneOf(MODES))];
  VIEW.slice=get('slice',numParse,v=>Number.isInteger(v)&&v>=-2&&v<=2);
  VIEW.frac=get('frac',bool);
  // Unit system: a preset id, or custom with its constants. An older link naming a Gaussian
  // point by L,M,T exponents opens in the Gaussian system, where that point still sits.
  shareLegacyGauss=false;
  [...(q.get('vec')||'').split(/[;~]/),q.get('focus')||''].forEach(x=>{if(x)ptParse(x);});
  let sys=get('sys',s=>s==='custom'||SYS_BY_ID.has(s)?s:null);
  if(!q.has('sys')&&shareLegacyGauss) sys='gauss';
  if(sys==='custom'){
    const k=get('k',s=>{const a=s==='none'?[]:s.split(',');return a.every(id=>id in CONSTS)?a:null;});
    const pre=sysOfK(k,'M'); VIEW.sys=pre?pre.id:'custom'; VIEW.k=CONST_ORDER.filter(id=>k.includes(id)); VIEW.basis='M';
  } else {const sy=SYS_BY_ID.get(sys); VIEW.sys=sy.id; VIEW.k=[...sy.k]; VIEW.basis=sy.basis||'M';}
  VIEW.xdims=get('xd',bool);
  // Overlays are cleared, then rebuilt from the link
  hideCard(); setDrawMode(false); setOperator(null);
  [...userVecs].forEach(removeUserVector);
  applyView();
  // Visibility and labels (through their controls, so the panel shows the same thing)
  const seg=(segs,v)=>segs&&segs.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  metricsVis=get('spheres',oneOf(VISV)); seg(visUI.Spheres,metricsVis); applyMetricsVis();
  labelsVis=get('labels',oneOf(VISV)); seg(visUI.Labels,labelsVis);
  lblSize=get('lsize',numParse,v=>v>=6&&v<=20); lblUI.ss.value=lblSize; lblUI.sv2.textContent=`${lblSize}px`;
  const fid=get('lfont',s=>LBL_FONTS.some(f=>f[0]===s)?s:null);
  lblFont=LBL_FONTS.find(f=>f[0]===fid)[2]; lblUI.fsel.value=lblFont;
  lblEffect=get('lfx',oneOf(LFX)); seg(lblUI.xs,lblEffect); applyNodeEffect();
  setFormulas(get('formulas',bool));
  setAutoRot(get('rot',bool));
  // Camera: orbit target, eye position, then lens
  const tgt=get('tgt',s=>vecParse(s,3),a=>a.every(v=>Math.abs(v)<100));
  const cam=get('cam',s=>vecParse(s,3),a=>a.every(v=>Math.abs(v)<200)&&Math.hypot(a[0]-tgt[0],a[1]-tgt[1],a[2]-tgt[2])>1e-3);
  camTween=null;
  if(usingOrtho) exitOrtho(SHARE_V1.fov);
  controls.target.fromArray(tgt); perspCam.position.fromArray(cam);
  const ortho=q.get('proj')==='ortho';
  if(q.has('proj')&&!['ortho','persp'].includes(q.get('proj'))) skipped++;
  if(ortho){
    perspCam.fov=SHARE_V1.fov; perspCam.updateProjectionMatrix(); controls.update();
    enterOrtho(); orthoCam.zoom=get('zoom',numParse,v=>v>0.01&&v<100); orthoCam.updateProjectionMatrix();
    fovSlider.value=0; updFov(0);
  } else {
    perspCam.fov=get('fov',numParse,v=>v>=2&&v<=90); perspCam.updateProjectionMatrix();
    const sv=Math.round(Math.pow((perspCam.fov-2)/88,1/1.3)*100); fovSlider.value=sv; updFov(sv);
  }
  controls.update();
  // Vectors, then whichever overlay was on, then the point whose card was open
  if(q.has('vec')) q.get('vec').split(';').forEach(pair=>{
    const[a,b]=pair.split('~').map(ptParse);
    if(!(a&&b&&a!==b&&!a.off&&!b.off&&addUserVector(a,b,true))) skipped++;
  });
  if(q.has('op')){
    const op=OPERATORS.find(o=>o.id===q.get('op'));
    if(op){if(op===POW_OP){const n=get('n',numParse,v=>v!==0&&Math.abs(v)<=6);POW_OP.scale=n;
      const nin=document.querySelector('.nin'); if(nin){nin.value=fracStr(n);nin.classList.remove('bad');}}
      setOperator(op);} else skipped++;
  } else if(q.has('law')){
    const law=POWER_LAWS.find(l=>l.id===q.get('law')); if(law) setLaw(law); else skipped++;
  }
  if(q.has('focus')){
    const pt=ptParse(q.get('focus'));
    if(pt){const keep=controls.target.clone(); focusPoint(pt); camTween=null; controls.target.copy(keep); controls.update();}
    else skipped++;
  }
  // Keys this version does not know (a newer link) are reported, never fatal
  const KNOWN=new Set(['v','cam','tgt','fov','proj','zoom','dims','mode','lam','slice','frac','sys','k','xd','spheres','labels','lsize','lfont','lfx','formulas','rot','op','n','law','vec','focus']);
  q.forEach((_,k)=>{if(!KNOWN.has(k))skipped++;});
  return{skipped,newer:ver>SHARE_VERSION};
}
function loadShareFromHash(){

  else if(r.skipped) toast(`Opened shared view (${r.skipped} setting${r.skipped>1?'s':''} no longer available)`);
  else toast('Opened shared view');
}
async function shareView(){

  }
  try{await navigator.clipboard.writeText(url);toast('Link to this view copied');}
  catch{copyText(url);}
}
document.getElementById('shareBtn').addEventListener('click',shareView);
addEventListener('hashchange',loadShareFromHash);

// Share & source: last section of the controls panel
(()=>{
  const div=document.createElement('div');
  const b=document.createElement('button'); b.className='pbtn'; b.textContent='🔗 Copy link to this view'; b.style.width='100%';
  b.title='The link holds the camera, dimensions, labels, vectors and any operator or power law';
  b.addEventListener('click',shareView); b.addEventListener('mousedown',e=>e.stopPropagation());
  const note=document.createElement('div'); note.style.cssText='margin-top:6px;font-size:8px;color:#627fb1;line-height:1.6;';
  note.textContent='Links keep working in later versions: quantities are saved by their exponents, not by name.';
  const a=document.createElement('a'); a.className='plink'; a.href=REPO_URL; a.target='_blank'; a.rel='noopener';
  a.textContent='Source code on GitHub ↗';

  panel.appendChild(acc('SHARE & SOURCE',div,true));
})();
SEARCH_INDEX.push(
  {kind:'control',title:'Share link',sub:'Copy a link that reopens this exact view',keys:['share','link','url','copy','permalink','bookmark','send'],sym:[],go:shareView},
  {kind:'control',title:'Source code (GitHub)',sub:'physical-metric-space repository',keys:['source','code','github','repo','repository'],sym:[],go:()=>window.open(REPO_URL,'_blank','noopener')});
loadShareFromHash();

// ── Render loop ───────────────────────────────────────────────────────────────
const _bw=new THREE.Vector3();
const ROT=0.027;
function animate(){
  requestAnimationFrame(animate);
  if(KEYS['ArrowLeft'])  controls.rotateLeft(ROT);
  if(KEYS['ArrowRight']) controls.rotateLeft(-ROT);
  if(KEYS['ArrowUp'])    controls.rotateUp(ROT);
  if(KEYS['ArrowDown'])  controls.rotateUp(-ROT);
  if(KEYS['+']||KEYS['=']) controls.dollyIn(1.04);
  if(KEYS['-']||KEYS['_']) controls.dollyOut(1.04);
  controls.update();
  if(sysTween) stepSysTween(performance.now());

  // No manual ortho sync needed — controls.object handles it directly
  activeCamera = usingOrtho ? orthoCam : perspCam;

  if(lblEffect==='pill') PTS.forEach(pt=>{if(pt.ring.visible)pt.ring.quaternion.copy(activeCamera.quaternion);});
  PTS.forEach(pt=>{if(pt.holder)pt.holder.quaternion.copy(activeCamera.quaternion);});

  const dpr=window.devicePixelRatio||1;
  lc.setTransform(dpr,0,0,dpr,0,0); lc.clearRect(0,0,W,H); lc.textAlign='center';

  AXIS_LABELS.forEach(({p,t,c})=>{const[sx,sy]=toSc(p.x,p.y,p.z);drawLbl(sx,sy+16,t,c.r,c.g,c.b,false,false);});
  AXIS_TICKS.forEach(({p,t,c,dx,dy})=>{const[sx,sy]=toSc(p.x,p.y,p.z);drawLbl(sx+dx,sy+dy,t,c.r,c.g,c.b,false,true);});
  if(sliceMode()){
    const c=dimColor('A',VIEW.slice);
    lc.font=`bold ${lblSize+3}px ${lblFont}`; lc.textAlign='right'; lc.fillStyle=ink(c.css);
    lc.fillText(`slice A = ${VIEW.slice}`,W-16,H-12); lc.textAlign='center';
  }
  // Pre-compute hover sets once — shared by label pass and 3D highlight pass
  const anyHov=!!(hovered||hoveredFormula||hoveredUV||hoveredOp||hoveredCm||focusPt||focusFo);
  const activeFos=new Set(), activePts=new Set(), activeOps=new Set();
  if(anyHov){
    if(hoveredFormula){
      activeFos.add(hoveredFormula);
      PTS.forEach(pt=>{if(pt.key===hoveredFormula.fromKey||pt.key===hoveredFormula.toKey)activePts.add(pt);});
    }
    if(hoveredUV){activePts.add(hoveredUV.from);activePts.add(hoveredUV.to);}
    if(hoveredCm) activePts.add(hoveredCm.pt);
    if(hoveredOp){(hoveredOp.law?opObjs:[hoveredOp]).forEach(o=>{activeOps.add(o);if(o.from)activePts.add(o.from);if(o.to)activePts.add(o.to);});}
    if(hovered) opObjs.forEach(o=>{if(o.from===hovered||o.to===hovered){activeOps.add(o);activePts.add(o.from);if(o.to)activePts.add(o.to);}});
    if(focusPt) activePts.add(focusPt);
    if(focusFo){
      activeFos.add(focusFo);
      PTS.forEach(pt=>{if(pt.key===focusFo.fromKey||pt.key===focusFo.toKey)activePts.add(pt);});
    }
    if(hovered){
      activePts.add(hovered);
      formulaObjs.forEach(fo=>{
        if(fo.g.visible&&(fo.fromKey===hovered.key||fo.toKey===hovered.key)){
          activeFos.add(fo);
          PTS.forEach(pt=>{if(pt.key===fo.fromKey||pt.key===fo.toKey)activePts.add(pt);});
        }
      });
    }
  }

  // A shown power law takes focus like a hover: its path and endpoints stay bright, the rest fades
  if(activeLaw&&!anyHov) opObjs.forEach(o=>{if(o.ghost)return;activeOps.add(o);if(o.from)activePts.add(o.from);if(o.to)activePts.add(o.to);});
  [...activePts].forEach(p=>{if(p.leadPt)activePts.add(p.leadPt);});
  const dim=anyHov||!!activeLaw;
  if(labelsVis!=='hidden'){
    const baseAlpha=labelsVis==='low'?0.3:1;
    PTS.filter(pt=>pt.lead).map(pt=>{const[sx,sy,z]=toSc(pt.pos.x,pt.pos.y,pt.pos.z);return{pt,sx,sy,z};})
      .sort((a,b)=>b.z-a.z)
      .forEach(({pt,sx,sy})=>{
        const isActive=activePts.has(pt), isDirect=hovered===pt||focusPt===pt;
        lc.globalAlpha=dim?(isActive?1:0.12):baseAlpha;
        const{r,g,b}=pt.col,isH=isDirect,n=grpEntries(pt).length;
        const boost=dim?(isDirect?4:isActive?2:0):0;
        if(pt.beads&&(hovered===pt||hoveredCm&&hoveredCm.pt===pt)){
          // Expanded: one label per commensurable member, pushed out radially from its bead
          pt.beads.forEach(m=>{
            const[bx,by]=toSc(...m.bead.getWorldPosition(_bw).toArray());
            const dx=bx-sx, dy=by-sy, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
            const hot=hoveredCm===m, sz=lblSize+(hot?2.5:1);
            lc.font=`${hot?'bold ':''}${sz}px ${lblFont}`;
            lc.textAlign=ux>0.25?'left':ux<-0.25?'right':'center';
            const tx=bx+ux*9, ty=by+uy*9+(uy>0.25?sz*.8:uy<-0.25?-2:sz*.35);
            lc.strokeStyle=TH.halo;lc.lineWidth=Math.max(2,sz*.25);lc.lineJoin='round';
            lc.strokeText(m.label,tx,ty); {const c=new THREE.Color(m.css); lc.fillStyle=liftCss(Math.round(c.r*255),Math.round(c.g*255),Math.round(c.b*255));} lc.fillText(m.label,tx,ty);
          });
          lc.textAlign='center';
          return;
        }
        const main=activeLaw&&lawLanding&&lawLanding.pt.leadPt===pt?lawLanding.name:pt.entries[0];
        drawLbl(sx,sy,n>1?`${main} +${n-1}`:main,r,g,b,isH,false,boost);
        if(n>1&&!isH){lc.font=`8px ${lblFont}`;lc.fillStyle=liftCss(r,g,b,.7);lc.fillText(`×${n}`,sx,sy+(lblSize*.8));}
      });
    lc.globalAlpha=1;
  }
  overlayLabels.forEach(({pos,text,col})=>{
    const[sx,sy]=toSc(...pos);
    lc.globalAlpha=1;
    drawLbl(sx,sy,text,col.r,col.g,col.b,true,false,1.5);
  });
  if(showFormulas){
    formulaObjs.forEach(fo=>{
      if(!fo.g.visible) return;
      const[sx,sy]=toSc(fo.mid.x,fo.mid.y,fo.mid.z);
      const foActive=activeFos.has(fo), foDirect=hoveredFormula===fo||focusFo===fo;
      lc.globalAlpha=dim?(foActive?1:0.10):1;
      const foBoost=dim?(foDirect?3:foActive?2:0):0;
      lc.font=`bold ${Math.max(7,lblSize-1+foBoost)}px ${lblFont}`;
      lc.textAlign='center';
      lc.strokeStyle=TH.halo;
      lc.lineWidth=2.8;
      lc.lineJoin='round';
      lc.strokeText(fo.def.label,sx,sy-6);
      lc.fillStyle=liftCss(fo.midCol.r,fo.midCol.g,fo.midCol.b);
      lc.fillText(fo.def.label,sx,sy-6);
    });
    lc.globalAlpha=1;
  }
  userVecs.forEach(uv=>{
    const[sx,sy]=toSc(uv.mid.x,uv.mid.y,uv.mid.z);
    const isH=hoveredUV===uv||selectedUV===uv;
    lc.globalAlpha=dim&&hoveredUV!==uv&&!activePts.has(uv.from)?0.25:1;
    const sz=lblSize+(isH?2:0.5);
    lc.font=`bold ${sz}px ${lblFont}`; lc.textAlign='center';
    const m=lc.measureText(uv.eq.short),p=5,y0=sy+sz+8;
    lc.fillStyle=TH.uvPill; rrect(lc,sx-m.width/2-p,y0-sz*.85,m.width+p*2,sz*1.45,5); lc.fill();
    lc.strokeStyle=TH.ink(isH?.9:.45); lc.lineWidth=isH?1.4:.9; lc.stroke();
    lc.fillStyle=liftCss(uv.midCol.r,uv.midCol.g,uv.midCol.b); lc.fillText(uv.eq.short,sx,y0);
  });
  lc.globalAlpha=1;
  // Rubber-band preview from the chosen start point to the cursor (snaps to a hovered point)
  if(drawMode&&drawStart){
    const[ax,ay]=toSc(drawStart.pos.x,drawStart.pos.y,drawStart.pos.z);
    lc.strokeStyle=TH.ink(.95); lc.lineWidth=2;
    lc.beginPath(); lc.arc(ax,ay,11,0,Math.PI*2); lc.stroke();
    let end=null;
    if(hovered&&hovered!==drawStart){const[bx,by]=toSc(hovered.pos.x,hovered.pos.y,hovered.pos.z);end=[bx,by];}
    else if(lastMouse) end=toView(lastMouse.x,lastMouse.y);
    if(end){
      lc.setLineDash([6,5]); lc.strokeStyle=drawStart.col.css; lc.lineWidth=2;
      lc.beginPath(); lc.moveTo(ax,ay); lc.lineTo(end[0],end[1]); lc.stroke(); lc.setLineDash([]);
    }
  }
  // Pulsing ring around a point picked from search
  if(focusPt){
    const[fx,fy]=toSc(focusPt.pos.x,focusPt.pos.y,focusPt.pos.z), ph=(performance.now()%1400)/1400;
    lc.strokeStyle=TH.ink(1-ph); lc.lineWidth=2;
    lc.beginPath(); lc.arc(fx,fy,10+ph*18,0,Math.PI*2); lc.stroke();
  }
  // Smoothly re-centre the orbit on a searched-for point
  if(camTween){
    const t=Math.min(1,(performance.now()-camTween.t0)/650), e=t*t*(3-2*t);
    controls.target.lerpVectors(camTween.from,camTween.to,e);
    if(t>=1) camTween=null;
  }
  lc.shadowBlur=0;

  // ── 3D hover highlights ───────────────────────────────────────────────────────
  opObjs.forEach(o=>{
    if(o.ghost) return;
    const op=dim?(activeOps.has(o)?1:0.08):o.baseOp;
    if(o.shaftMat.opacity!==op){o.shaftMat.opacity=op;o.coneMat.opacity=op;}
  });
  PTS.forEach(pt=>{
    if(!pt.beads) return;
    const lowV=metricsVis==='low';
    pt.beads.forEach(m=>{
      const op=dim?(activePts.has(pt)?(hoveredCm===m?1:0.9):0.1):(lowV?0.25:0.9);
      if(m.mat.opacity!==op) m.mat.opacity=op;
      const sc=hoveredCm===m?1.6:1; m.bead.scale.setScalar(sc);
    });
  });
  userVecs.forEach(uv=>{
    const op=dim?(hoveredUV===uv||activePts.has(uv.from)&&activePts.has(uv.to)?1:0.25):0.95;
    if(uv.shaftMat.opacity!==op){uv.shaftMat.opacity=op;uv.coneMat.opacity=op;}
  });
  if(showFormulas){
    formulaObjs.forEach(fo=>{
      if(!fo.g.visible) return;
      const op=dim?(activeFos.has(fo)?1.0:0.10):0.72;
      if(fo.shaftMat.opacity!==op){fo.shaftMat.opacity=op;fo.shaftMat.needsUpdate=true;}
      if(fo.coneMat.opacity!==op){fo.coneMat.opacity=op;fo.coneMat.needsUpdate=true;}
    });
  }
  if(metricsVis!=='hidden'){
    const baseOp=metricsVis==='low'?0.18:1;
    PTS.forEach(pt=>{
      if(!pt.vis.visible) return;
      const op=pt.ghost?0.1:dim?(activePts.has(pt)?1.0:Math.min(baseOp,0.15)):baseOp;
      const tr=op<1;
      if(pt.vis.material.opacity!==op||pt.vis.material.transparent!==tr){pt.vis.material.opacity=op;pt.vis.material.transparent=tr;pt.vis.material.needsUpdate=true;}
    });
  }

  renderer.render(scene,activeCamera);
}
animate();
</script>
